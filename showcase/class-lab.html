<title>One Dataset Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: EEG strip-chart paper — gridded recording strip as header, timetable grid of weeks, ruled ledger panels; square corners, ink rules, one electrode-red accent */
:root{
  --paper:#fafaf7; --ink:#111214; --muted:#5d5f63; --rule:#111214; --hair:#cfd0cc;
  --grid:rgba(214,58,44,.13); --grid2:rgba(214,58,44,.28);
  --red:#d63a2c; --red-ink:#ffffff; --hi:#fff1a8;
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Nanum Gothic Coding",ui-monospace,Menlo,Consolas,monospace;
  --surface:var(--paper); --accent:var(--red); --line:var(--hair); --bg:var(--paper); --good:#1d7a3e; --warm:var(--red); --warm-soft:#fde8e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141516; --ink:#ecebe6; --muted:#a3a39d; --rule:#ecebe6; --hair:#3a3b3d;
  --grid:rgba(255,105,90,.10); --grid2:rgba(255,105,90,.22);
  --red:#ff6a5a; --red-ink:#141516; --hi:#4a4220; --good:#6cc98a; --warm-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141516; --ink:#ecebe6; --muted:#a3a39d; --rule:#ecebe6; --hair:#3a3b3d;
  --grid:rgba(255,105,90,.10); --grid2:rgba(255,105,90,.22);
  --red:#ff6a5a; --red-ink:#141516; --hi:#4a4220; --good:#6cc98a; --warm-soft:#3a1f1c; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
header{display:grid;gap:10px;border-top:6px solid var(--rule);padding-top:14px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted)}
.eyebrow::before{content:"● REC  ";color:var(--red)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,56px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;margin:0 0 4px}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
.sub{max-width:62ch;font-size:15px}
.demo{justify-self:start;font-family:var(--mono);font-size:12px;background:var(--hi);color:var(--ink);padding:2px 6px}
canvas#trace{width:100%;height:150px;display:block;margin-top:6px;border:1.5px solid var(--rule);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px}
nav{display:flex;flex-wrap:wrap;margin-block:22px 24px;border:1.5px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:2}
nav button{font:inherit;font-size:14px;font-weight:700;background:none;border:0;border-right:1.5px solid var(--rule);color:var(--ink);padding:10px 16px;cursor:pointer;flex:1 1 auto}
nav button:last-child{border-right:0}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
nav button:hover:not([aria-selected="true"]){background:var(--grid)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.panel{display:grid;gap:18px}
.panel>div:first-child{border-bottom:1.5px solid var(--rule);padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0}
.chip::before{content:"["}.chip::after{content:"]"}
.chip.lec{color:var(--ink)}
.chip.lab{color:var(--red);font-weight:700}
.chip.now{background:var(--red);color:var(--red-ink);padding:0 4px}
.chip.now::before,.chip.now::after{content:""}
/* timetable */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.week{border-right:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.week .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--ink)}
.week.cur{background:var(--hi)}
.week .cnt{font-family:var(--mono);font-size:12px;color:var(--red)}
/* chart + tables */
.chart{border:1.5px solid var(--rule);padding:14px;overflow-x:auto;background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:10px 10px}
.chart svg{display:block;min-width:520px;width:100%;max-width:820px;height:auto}
[hidden]{display:none!important}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:12px}
.chart .lbl{fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:700}
.note{font-size:14px;color:var(--muted);max-width:70ch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
th{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px;border-bottom:1.5px solid var(--rule)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tablebox{overflow-x:auto;border-top:1.5px solid var(--rule)}
/* controls */
.filters{display:flex;flex-wrap:wrap;gap:8px}
select,input,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:0;padding:7px 10px}
.btn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--rule);color:var(--ink);background:var(--paper);border-radius:0;padding:6px 14px;cursor:pointer}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{border-color:var(--hair);color:var(--muted);font-weight:400}
/* gallery */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0;border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.card{border-right:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);padding:14px 16px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:18px}
.card .meta{font-size:13px;color:var(--muted)}
.metric{font-family:var(--display);font-size:34px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.metric small{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
.prompt{font-family:var(--mono);font-size:13px;line-height:1.6;border-left:3px solid var(--red);padding:4px 0 4px 12px;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
details summary{cursor:pointer;font-size:13px;font-weight:700}
details summary::marker{color:var(--red)}
.comments{display:grid;gap:4px;font-size:13px;border-top:1px dashed var(--hair);padding-top:8px}
.comments:empty{display:none}
.comment b{font-weight:700}
.cmtform{display:flex;gap:6px}
.cmtform input{flex:1;min-width:0}
/* library */
.lib{display:grid;border-top:1.5px solid var(--rule)}
.libitem{border-bottom:1px solid var(--hair);padding:14px 0;display:grid;gap:6px;min-width:0}
/* form */
form{display:grid;gap:14px;max-width:760px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr} nav button{flex-basis:33%;border-bottom:1.5px solid var(--rule)}}
.toast{font-size:13px;color:var(--good)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--hi);padding:8px 10px}
.check input{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header>
  <span class="eyebrow">BCI 데이터 분석 · 2026-2학기</span>
  <h1>하나의 EEG 데이터, 여러 갈래의 분석</h1>
  <p class="sub">매주 새 분석 기법을 배우고, 다음 주에 같은 데이터로 실습합니다. 결과와 함께 AI에게 준 프롬프트를 제출하고, 서로의 분석을 보며 의견을 남깁니다.</p>
  <span class="demo">시제품 · 아래 학생 제출물은 화면 구성을 보여주기 위한 예시입니다</span>
  <canvas id="trace" aria-hidden="true"></canvas>
</header>

<nav role="tablist">
  <button role="tab" data-tab="weeks" aria-selected="true">주차 일정</button>
  <button role="tab" data-tab="compare" aria-selected="false">결과 비교</button>
  <button role="tab" data-tab="gallery" aria-selected="false">제출 갤러리</button>
  <button role="tab" data-tab="library" aria-selected="false">프롬프트 라이브러리</button>
  <button role="tab" data-tab="submit" aria-selected="false">제출하기</button>
</nav>

<section class="panel" id="p-weeks"></section>
<section class="panel" id="p-compare" hidden></section>
<section class="panel" id="p-gallery" hidden></section>
<section class="panel" id="p-library" hidden></section>
<section class="panel" id="p-submit" hidden></section>
</div>

<script>
const WEEKS=[
 {n:1,type:"lec",title:"데이터 이해와 전처리",desc:"운동상상 EEG 데이터 구조, 필터링, 에포크 분할"},
 {n:2,type:"lab",title:"전처리 실습",desc:"밴드패스 필터와 아티팩트 제거를 직접 해보고 파형 비교",method:"전처리"},
 {n:3,type:"lec",title:"지도학습 ①",desc:"CSP 특징 추출, LDA·SVM 분류기"},
 {n:4,type:"lab",title:"지도학습 실습",desc:"CSP+LDA / CSP+SVM으로 좌·우손 상상 분류",method:"지도학습"},
 {n:5,type:"lec",title:"비지도학습",desc:"PCA, ICA, k-means로 데이터 구조 탐색"},
 {n:6,type:"lab",title:"비지도학습 실습",desc:"군집 결과를 실제 라벨과 비교",method:"비지도학습"},
 {n:7,type:"lec",title:"딥러닝",desc:"EEGNet, ShallowConvNet 구조 이해"},
 {n:8,type:"lab",title:"딥러닝 실습",desc:"같은 데이터로 CNN 학습, 앞선 방법과 비교",method:"딥러닝"},
 {n:9,type:"lec",title:"최종 발표",desc:"한 학기 분석을 하나의 이야기로 정리해 발표"}
];
const CURRENT=4;
const SUBS=[
 {id:1,who:"학생 A",week:4,method:"지도학습",algo:"CSP + LDA",tool:"ChatGPT",acc:71.5,
  prompt:"MNE-Python으로 운동상상 EEG(C3, Cz, C4 포함 22채널)를 8–30Hz로 필터링하고, CSP 4개 성분을 뽑아 LDA로 좌/우 분류하는 코드를 작성해줘. 5-fold 교차검증 정확도를 출력하고, 각 단계에 주석을 달아줘.",
  note:"CSP 성분 수를 2→6으로 바꿔보니 4개에서 가장 좋았다.",comments:[{who:"학생 C",t:"필터 대역을 mu(8–13Hz)만 쓰면 어떻게 달라지는지 궁금해요."}]},
 {id:2,who:"학생 B",week:4,method:"지도학습",algo:"CSP + SVM (RBF)",tool:"Claude",acc:74.2,
  prompt:"CSP 특징으로 SVM(RBF 커널)을 학습시키고 C와 gamma를 그리드서치로 찾는 코드를 써줘. 데이터 누수가 생기지 않도록 CSP를 교차검증 fold 안에서 학습하도록 해줘.",
  note:"처음에는 CSP를 전체 데이터로 학습해서 정확도가 89%로 너무 높게 나왔다. AI에게 누수를 막아 달라고 다시 요청했다.",comments:[{who:"학생 A",t:"누수 얘기 좋네요. 저도 다시 확인해봐야겠어요."},{who:"교수",t:"이번 주 발표에서 이 부분을 같이 짚어봅시다."}]},
 {id:3,who:"학생 C",week:4,method:"지도학습",algo:"Filter-bank CSP + LDA",tool:"Claude",acc:76.8,
  prompt:"4–40Hz를 4Hz 간격 9개 대역으로 나눠 각 대역에서 CSP를 하고, 상호정보량으로 특징을 골라 LDA로 분류하는 Filter-Bank CSP를 구현해줘.",
  note:"대역별로 어떤 특징이 선택됐는지 그림으로 그려보니 mu·beta 대역이 대부분이었다.",comments:[]},
 {id:4,who:"학생 D",week:2,method:"전처리",algo:"ICA 기반 안구 아티팩트 제거",tool:"Gemini",acc:null,
  prompt:"EOG 채널을 이용해 ICA 성분 중 눈 깜빡임 성분을 자동으로 찾아 제거하고, 제거 전후 파형을 겹쳐 그려줘.",
  note:"자동으로 고른 성분이 실제로 눈 깜빡임인지 토포맵을 보고 직접 확인했다.",comments:[]},
 {id:5,who:"학생 E",week:4,method:"지도학습",algo:"Riemannian (MDM)",tool:"ChatGPT",acc:73.0,
  prompt:"pyriemann으로 공분산 행렬을 구하고 MDM 분류기로 좌/우 운동상상을 분류해줘. CSP+LDA와 같은 교차검증 분할을 써서 비교할 수 있게 해줘.",
  note:"코드는 금방 나왔지만 pyriemann 버전이 달라 함수 이름 오류가 있었다.",comments:[]}
];
let subs=SUBS.map(s=>({...s,comments:[...s.comments]}));

function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const k of kids)e.append(k instanceof Node?k:document.createTextNode(k??""));return e}

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function showTab(t){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=="p-"+t);try{localStorage.setItem('odl-tab',t)}catch(e){}}

/* weeks */
function renderWeeks(){const p=document.getElementById('p-weeks');p.replaceChildren(
 el('div',{},el('h2',{},'주차 일정'),el('p',{class:'note'},'강의 주차에 기법을 배우고, 이어지는 실습 주차에 같은 데이터로 분석해 결과와 프롬프트를 제출합니다.')),
 el('div',{class:'weeks'},...WEEKS.map(w=>{const cnt=subs.filter(s=>s.week===w.n).length;return el('div',{class:'week'+(w.n===CURRENT?' cur':'')},
  el('div',{class:'row'},el('span',{class:'n'},'WEEK '+String(w.n).padStart(2,'0')),el('span',{class:'chip '+w.type},w.type==='lec'?'강의':'실습'),w.n===CURRENT?el('span',{class:'chip now'},'이번 주'):''),
  el('h3',{},w.title),el('p',{class:'note'},w.desc),
  w.type==='lab'?el('span',{class:'cnt'},`제출 ${cnt}건`):'')})))}

/* compare */
function renderCompare(){const p=document.getElementById('p-compare');const rows=subs.filter(s=>s.acc!=null).sort((a,b)=>b.acc-a.acc);
 const W=640,rowH=34,top=10,left=190,right=60,H=top+rows.length*rowH+30,x=v=>left+(v-50)/(100-50)*(W-left-right);
 const ns="http://www.w3.org/2000/svg";const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','방법별 분류 정확도 비교');
 const mk=(t,a,txt)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e};
 [50,60,70,80,90,100].forEach(v=>{mk('line',{x1:x(v),x2:x(v),y1:top,y2:H-24,stroke:'var(--line)','stroke-width':1});mk('text',{x:x(v),y:H-8,'text-anchor':'middle'},v+'%')});
 mk('line',{x1:x(50),x2:x(50),y1:top,y2:H-24,stroke:'var(--muted)','stroke-dasharray':'3 3'});
 rows.forEach((s,i)=>{const y=top+i*rowH;mk('text',{x:left-10,y:y+20,'text-anchor':'end',class:'lbl'},s.algo);
  mk('rect',{x:x(50),y:y+7,width:x(s.acc)-x(50),height:18,rx:0,fill:i===0?'var(--red)':'var(--ink)'});
  mk('text',{x:x(s.acc)+6,y:y+20,style:'font-family:var(--mono)'},s.acc.toFixed(1)+'%')});
 p.replaceChildren(el('div',{},el('h2',{},'4주차 · 같은 데이터, 다른 분류기'),el('p',{class:'note'},'모두 같은 데이터와 같은 5-fold 교차검증 분할을 썼기 때문에 숫자를 바로 비교할 수 있습니다. 점선은 우연 수준(50%)입니다.')),
  el('div',{class:'chart'},svg),
  el('div',{class:'tablebox'},el('table',{},el('thead',{},el('tr',{},...['학생','방법','AI 도구','정확도'].map(h=>el('th',{},h)))),
   el('tbody',{},...rows.map(s=>el('tr',{},el('td',{},s.who),el('td',{},s.algo),el('td',{},s.tool),el('td',{class:'num'},s.acc.toFixed(1)+'%')))))))}

/* gallery */
let gWeek="all",gTool="all";
function renderGallery(){const p=document.getElementById('p-gallery');
 const weekSel=el('select',{id:'g-week','aria-label':'주차 선택',onchange:e=>{gWeek=e.target.value;renderGallery()}},el('option',{value:'all'},'전체 주차'),...WEEKS.filter(w=>w.type==='lab').map(w=>el('option',{value:w.n},`${w.n}주차 · ${w.method}`)));weekSel.value=gWeek;
 const tools=[...new Set(subs.map(s=>s.tool))];const toolSel=el('select',{id:'g-tool','aria-label':'AI 도구 선택',onchange:e=>{gTool=e.target.value;renderGallery()}},el('option',{value:'all'},'모든 AI 도구'),...tools.map(t=>el('option',{value:t},t)));toolSel.value=gTool;
 const list=subs.filter(s=>(gWeek==='all'||s.week==+gWeek)&&(gTool==='all'||s.tool===gTool));
 p.replaceChildren(el('div',{},el('h2',{},'제출 갤러리'),el('p',{class:'note'},'다른 학생의 결과와 프롬프트를 보고 질문이나 아이디어를 남겨주세요.')),el('div',{class:'filters'},weekSel,toolSel),
  list.length?el('div',{class:'cards'},...list.map(card)):el('p',{class:'note'},'이 조건에 맞는 제출물이 아직 없습니다.'))}
function card(s){const inp=el('input',{id:'c-'+s.id,placeholder:'댓글 남기기','aria-label':s.who+' 제출물에 댓글'});
 return el('article',{class:'card'},
  el('div',{class:'row'},el('span',{class:'chip'},s.week+'주차'),el('span',{class:'chip'},s.method),el('span',{class:'chip'},s.tool)),
  el('div',{},el('h3',{},s.algo),el('p',{class:'meta'},s.who)),

/* 헤더: 운동영역 채널 4개를 기록지에 그린 모양 */
(function(){const c=document.getElementById('trace');const ctx=c.getContext('2d');const CH=["C3","Cz","C4","Pz"];
 function draw(){const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;ctx.setTransform(r,0,0,r,0,0);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),red=cs.getPropertyValue('--red').trim(),mono=cs.getPropertyValue('--mono');
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647-.5;const band=h/CH.length;
  CH.forEach((name,k)=>{const y0=band*(k+.5);ctx.fillStyle=ink;ctx.font="12px "+mono;ctx.fillText(name,8,y0+4);
   ctx.strokeStyle=k===1?red:ink;ctx.lineWidth=k===1?1.4:1;ctx.beginPath();
   for(let x=40;x<=w-6;x++){const t=x/60;const mu=Math.sin(t*10.5+k)*(.5+.5*Math.sin(t*.7+k*2));const v=mu*.32+Math.sin(t*3.1+k*1.7)*.18+rnd()*.28;const y=y0+v*band*.8;x===40?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()});
  ctx.fillStyle=cs.getPropertyValue('--muted').trim();ctx.font="11px "+mono;ctx.fillText("1 s",w-60,h-8);ctx.fillRect(w-60,h-22,50,1.5)}
 draw();addEventListener('resize',draw);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);document.fonts&&document.fonts.ready.then(draw)})();
