name: Build Windows EXE

# 이 워크플로는 GitHub의 Windows 서버에서 .exe 를 자동으로 빌드해준다.
# 완료되면 Actions 실행 결과의 "Artifacts"에서 exe(zip)를 내려받을 수 있다.

on:
  push:
    branches:
      - claude/audio-stimulus-player-ux59kc
    paths:
      - 'audio_stimulus_player/**'
      - 'run_app.py'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:      # Actions 탭에서 수동 실행도 가능

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: python -m pip install PySide6 pyserial pyinstaller

      - name: 실행파일(.exe) 빌드
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name AuditoryStimulusPlayer
          --collect-all PySide6
          run_app.py

      - name: 실행파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AuditoryStimulusPlayer-windows
          path: dist/AuditoryStimulusPlayer.exe
          retention-days: 30
          if-no-files-found: error
